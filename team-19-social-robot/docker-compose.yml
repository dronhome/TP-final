services:
  naoRobotAPI:
    build: 
      context: ./naoRobotAPI
      dockerfile: Dockerfile
    command: python server.py
    image: jperdek/nao-robot-api
    container_name: naoRobotAPI
    env_file: .env
    ports:
      - "8001:5000"
    environment:
      HOST_PORT: ${HOST_PORT:-1234}
      HOST_IP: ${HOST_IP:-127.0.0.1}
      NAO_PORT: ${NAO_PORT:-9559}
      NAO_IP: host.docker.internal
      # NAO_IP: 10.62.44.100
      FLASK_ENV: development
    networks:
      - buildernet
    extra_hosts:
      - "host.docker.internal:host-gateway"

  skeletonFinderAPI:
    build: 
      context: ./skeletonFinderAPI
      dockerfile: Dockerfile
    command: python server.py
    image: jperdek/skeleton-finder-api
    container_name: skeletonFinderAPI
    env_file: .env
    ports:
      - "8002:6001"
    environment:
      FLASK_ENV: development
    volumes:
      - /home/ubuntu/Pictures:/images:ro
    networks:
      - buildernet

  translatorAPI:
    build:
      context: ./translator
      dockerfile: Dockerfile
    command: python nao_pose_service.py
    image: jperdek/translator-api
    container_name: translatorAPI
    env_file: .env
    ports:
      - "8003:7000"
    environment:
      FLASK_ENV: development 
    volumes:
      - /home/ubuntu/Pictures:/home/ubuntu/Pictures
    depends_on:
      - naoRobotAPI
      - skeletonFinderAPI
    networks:
      - buildernet

  voiceCommandAPI:
    build:
      context: ./voiceCommandAPI
      dockerfile: Dockerfile
    command: python server.py
    image: jperdek/voice-command-api
    container_name: voiceCommandAPI
    env_file: .env
    ports:
      - "8004:8000"
    environment:
      FLASK_ENV: development
      NAO_SET_POSE_URL: http://naoRobotAPI:5000/setting_pose/setPose
    depends_on:
      - naoRobotAPI
    networks:
      - buildernet

networks:
  buildernet:
    driver: "bridge"
