server {
    listen 80;
    server_name localhost;

    client_max_body_size 500m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Legacy /api/ → translator (used by main page upload)
    location /api/ {
        proxy_pass http://translatorapi:7000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_read_timeout 300s;
    }

    # Translator-owned exercise endpoints
    location = /exercise/from_video {
        proxy_pass http://translatorapi:7000/exercise/from_video;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_read_timeout 700s;
    }

    location ~ ^/exercise/[^/]+/run$ {
        proxy_pass http://translatorapi:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Exercise config service (frames, sequence, images)
    location /exercise/ {
        proxy_pass http://exerciseconfigservice:7001/exercise/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }

    # Pose images
    location ~ ^/pose/[^/]+/image$ {
        proxy_pass http://voicecommandapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Voice command / pose registry
    location /commands {
        proxy_pass http://voicecommandapi:8000/commands;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /command {
        proxy_pass http://voicecommandapi:8000/command;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
