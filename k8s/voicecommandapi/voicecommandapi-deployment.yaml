apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicecommandapi-deployment
  labels:
    app: voicecommandapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicecommandapi
  template:
    metadata:
      labels:
        app: voicecommandapi
    spec:
      containers:
        - name: voicecommandapi
          image: berserkchmonya/voice-command-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_ENV
              value: "production"
            - name: NAO_SET_POSE_URL
              value: "http://naorobotapi:5000/setting_pose/setPose"
          readinessProbe:
            httpGet:
              path: /commands
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /commands
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: voicecommandapi
spec:
  selector:
    app: voicecommandapi
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
